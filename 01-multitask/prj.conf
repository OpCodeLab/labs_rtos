CONFIG_GPIO=y
CONFIG_PRINTK=y

# Debugging: thread list in Cortex-Debug, readable stepping
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y

# User mode threads isolated by the MPU
CONFIG_USERSPACE=y

# Interactive shell on the console UART (type "help", "led", "kernel threads")
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072

# littlefs file system in the internal flash (storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Shell commands: fs ls / fs cat / fs write / fs rm ...
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_MAIN_STACK_SIZE=4096
