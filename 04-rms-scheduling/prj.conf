CONFIG_GPIO=y
CONFIG_PRINTK=y

# Same tick as FreeRTOS (configTICK_RATE_HZ = 1000)
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# FreeRTOS round-robins equal priority tasks every tick (configUSE_TIME_SLICING).
# Zephyr does it only when time slicing is enabled with a non-zero slice.
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=1
CONFIG_TIMESLICE_PRIORITY=0

# Debugging: thread list in Cortex-Debug, readable stepping
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_NO_OPTIMIZATIONS=y
CONFIG_THREAD_NAME=y
